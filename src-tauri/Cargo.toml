[package]
name = "git-shift"
version = "0.1.0"
description = "Git Identity Manager - Switch between Git profiles easily"
authors = ["Ritesh"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
chrono = "0.4"
dirs = "5.0"
rand = "0.8"
tauri-plugin-autostart = "2.5.1"
reqwest = { version = "0.12", features = ["json"] }
