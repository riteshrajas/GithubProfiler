<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git-Shift</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <!-- Glass Container -->
        <div class="glass-panel">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <h1 class="app-title">Git-Shift</h1>
                    <p class="datetime" id="datetime"></p>
                </div>
                <div class="header-right">
                    <div class="avatar-strip" id="avatar-strip"></div>

                    <div class="dropdown-wrapper" id="main-menu-dropdown" style="margin-left: 12px;">
                        <button class="icon-btn" id="btn-menu">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="1"></circle>
                                <circle cx="12" cy="5" r="1"></circle>
                                <circle cx="12" cy="19" r="1"></circle>
                            </svg>
                        </button>
                        <div class="dropdown-menu">

                            <button class="dropdown-item" id="menu-about">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14"
                                    height="14">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="16" x2="12" y2="12"></line>
                                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                                </svg>
                                About
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <main class="content">
                <!-- Left Column: Profiles -->
                <section class="profiles-section" id="view-profiles">
                    <div class="section-header">
                        <h2 class="section-title">Git Profiles</h2>
                        <button class="icon-btn" id="btn-add" title="Add Profile">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="profiles-list" id="profiles-list"></div>

                    <!-- Add Profile Form (hidden by default) -->
                    <div class="add-profile-form" id="add-form" style="display: none;">
                        <h3 class="form-title">Add GitHub Profile</h3>
                        <div class="form-row">
                            <label>GitHub Username:</label>
                            <input type="text" id="new-name" placeholder="octocat" />
                        </div>
                        <div class="form-row">
                            <label>GitHub Email:</label>
                            <input type="text" id="new-email" placeholder="octocat@users.noreply.github.com" />
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-success" id="btn-save">✓ Save</button>
                            <button class="btn btn-danger" id="btn-cancel">✕ Cancel</button>
                        </div>
                    </div>

                    <!-- Edit Profile Form (hidden by default) -->
                    <div class="add-profile-form" id="edit-form" style="display: none;">
                        <h3 class="form-title">Edit Profile</h3>
                        <div class="form-row">
                            <label>GitHub Username:</label>
                            <input type="text" id="edit-name" />
                        </div>
                        <div class="form-row">
                            <label>GitHub Email:</label>
                            <input type="text" id="edit-email" />
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-success" id="btn-update">✓ Update</button>
                            <button class="btn btn-danger" id="btn-cancel-edit">✕ Cancel</button>
                        </div>
                    </div>


                    <!-- Contribution Graph View -->
                    <div class="graph-section" id="graph-section"
                        style="display: none; margin-top: auto; padding-top: var(--space-md); border-top: 1px solid var(--border-muted);">
                        <h3 class="section-title" style="margin-bottom: var(--space-sm);">Contribution Graph</h3>
                        <div class="graph-container" id="contribution-graph">
                            <div class="graph-placeholder">Select a profile to view contributions</div>
                        </div>
                    </div>
                </section>

                <!-- Right Column: Control Panel -->
                <aside class="control-panel">
                    <!-- Tab Navigation -->
                    <div class="tabs">
                        <button class="tab-btn active" id="tab-profiles" data-view="config">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <span>Active</span>
                        </button>
                        <button class="tab-btn" id="tab-labs" data-view="labs">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 3L5 7l4 4"></path>
                                <path d="M5 7h11a6 6 0 0 1 6 6v0a6 6 0 0 1-6 6H9"></path>
                            </svg>
                            <span>Labs</span>
                        </button>
                    </div>

                    <!-- Config View -->
                    <div class="tab-content active" id="view-config">
                        <div class="config-display" id="config-display">
                            <span class="no-selection">No profile selected</span>
                        </div>

                        <div class="control-group">
                            <label class="toggle-switch">
                                <input type="checkbox" id="autostart-toggle">
                                <span class="slider"></span>
                                <span class="label-text">Launch on startup</span>
                            </label>
                        </div>

                        <button class="btn btn-primary btn-large" id="btn-sync">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="8.5" cy="7" r="4"></circle>
                                <polyline points="17 11 19 13 23 9"></polyline>
                            </svg>
                            <span>Apply Identity</span>
                        </button>

                        <button class="btn btn-danger" id="btn-alert" style="display: none;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="8" x2="12" y2="12"></line>
                                <line x1="12" y1="16" x2="12.01" y2="16"></line>
                            </svg>
                            <span>Credential Conflict</span>
                        </button>
                    </div>



                    <!-- Labs View -->
                    <div class="tab-content" id="view-labs" style="display: none;">
                        <div class="lab-card">
                            <h3>Co-Author Generator</h3>
                            <p class="lab-desc">Select profiles to generate "Co-authored-by" trailers for your commit
                                message.
                            </p>
                            <div class="multi-select-list" id="co-author-list"></div>
                            <div class="lab-actions">
                                <button class="btn btn-success" id="btn-copy-coauthors">📋 Copy Snippet</button>
                            </div>
                            <div class="preview-box">
                                <label>Preview:</label>
                                <textarea id="co-author-preview" readonly></textarea>
                            </div>
                        </div>
                </aside>
            </main>

            <!-- Logs Panel -->
            <div class="logs-panel">
                <div class="logs-content" id="logs-content"></div>
            </div>

            <!-- Footer -->
            <footer class="footer">
                App made by Ritesh • Pyintel.online
            </footer>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
