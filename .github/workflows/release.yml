name: Release Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Check release condition
        id: check
        run: |
          RELEASE="false"
          if [ -f "release.txt" ]; then
            if grep -q "release=true" "release.txt"; then
              RELEASE="true"
              echo "Found release=true in release.txt"
            else
              echo "release.txt exists but does not contain release=true"
            fi
          elif [ -f "relase.txt" ]; then
            # Check for the typo version as requested
            if grep -q "relase=true" "relase.txt"; then
              RELEASE="true"
              echo "Found relase=true in relase.txt"
            else
              echo "relase.txt exists but does not contain relase=true"
            fi
          else
            echo "No release.txt (or relase.txt) found."
          fi
          echo "should_release=$RELEASE" >> "$GITHUB_OUTPUT"

  build-tauri:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
    
    runs-on: ${{ matrix.platform }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'ubuntu-latest' && 'x86_64-unknown-linux-gnu' || 'x86_64-pc-windows-msvc' }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev 
            build-essential 
            curl 
            wget 
            file 
            libssl-dev 
            libgtk-3-dev 
            libayatana-appindicator3-dev 
            librsvg2-dev

      - name: Install dependencies
        run: npm install

      - name: Build Tauri App
        run: npm run tauri build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
